<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ZX global spectrum — light</title>
  <desc id="desc">An airy global mesh with cyan and orange light.</desc>
