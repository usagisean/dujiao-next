      <stop stop-color="#fffdf9"/>
      <stop offset=".55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff3e8"/>
    </linearGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
