<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ZX Nexus orbital network — light</title>
  <desc id="desc">A warm ivory orbital system with cyan and orange signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset=".55" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#edf9fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".27"/>
      <stop offset=".45" stop-color="#0ea5e9" stop-opacity=".1"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0891b2"/>
      <stop offset=".52" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8a633f" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <ellipse cx="1260" cy="350" rx="430" ry="430" fill="url(#glow)"/>
  <circle cx="1260" cy="350" r="214" fill="none" stroke="url(#ring)" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="1260" cy="350" r="164" fill="none" stroke="#0891b2" stroke-opacity=".2" stroke-width="1.5"/>
  <circle cx="1260" cy="350" r="112" fill="#ffffff" fill-opacity=".62" stroke="#0891b2" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="1260" cy="350" r="62" fill="#38bdf8" fill-opacity=".13" filter="url(#blur)"/>
  <path d="M1046 350a214 214 0 0 1 344-170" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  <path d="M1120 485a164 164 0 0 0 260-24" fill="none" stroke="#ea580c" stroke-opacity=".86" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1084" cy="223" r="6" fill="#06b6d4"/>
  <circle cx="1424" cy="348" r="5" fill="#ea580c"/>
  <circle cx="1160" cy="500" r="4" fill="#0284c7"/>
  <g fill="#55758c" fill-opacity=".28">
    <circle cx="724" cy="112" r="2"/><circle cx="842" cy="582" r="2"/><circle cx="976" cy="152" r="3"/>
    <circle cx="1478" cy="92" r="2"/><circle cx="1510" cy="610" r="3"/><circle cx="610" cy="418" r="2"/>
  </g>
  <path d="M660 542h250" stroke="#0891b2" stroke-opacity=".12"/>
  <path d="M700 566h154" stroke="#c65f14" stroke-opacity=".1"/>
</svg>
