  <path d="M780 520C950 380 1090 270 1505 176" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M760 608c240-168 470-248 810-286" fill="none" stroke="url(#line)" stroke-opacity=".48"/>
  <g fill="#9de8ff">
