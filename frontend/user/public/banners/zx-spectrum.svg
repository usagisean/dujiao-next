<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ZX global spectrum</title>
  <desc id="desc">An elegant global mesh with cyan and violet light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080a11"/>
      <stop offset=".55" stop-color="#101425"/>
      <stop offset="1" stop-color="#17152c"/>
    </linearGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8b5cf6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <ellipse cx="1230" cy="142" rx="470" ry="300" fill="url(#violet)"/>
  <ellipse cx="1110" cy="586" rx="520" ry="260" fill="url(#cyan)"/>
