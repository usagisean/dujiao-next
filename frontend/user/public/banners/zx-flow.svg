<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ZX automated flow</title>
  <desc id="desc">A clean automated flow visual with emerald and cyan signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b11"/>
      <stop offset=".58" stop-color="#0b1720"/>
      <stop offset="1" stop-color="#0d2530"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".25" stop-color="#34d399"/>
      <stop offset=".7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2dd4bf" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b9f5ec" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
