  <path d="M760 562h156c36 0 58-22 58-58v-26c0-36 22-58 58-58h420" fill="none" stroke="url(#flow)" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#08151c" stroke="#61e9d0" stroke-width="2">
    <rect x="898" y="278" width="54" height="54" rx="12"/>
    <rect x="1172" y="278" width="54" height="54" rx="12"/>
    <rect x="1410" y="278" width="54" height="54" rx="12"/>
  </g>
  <g fill="#61e9d0">
    <circle cx="925" cy="305" r="6"/><circle cx="1199" cy="305" r="6"/><circle cx="1437" cy="305" r="6"/>
