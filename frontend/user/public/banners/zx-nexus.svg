<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ZX Nexus orbital network</title>
  <desc id="desc">A restrained blue orbital system on a deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#0b1221"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55d9ff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#338cff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ee7ff"/>
      <stop offset=".55" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#8fb6d8" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <ellipse cx="1260" cy="350" rx="430" ry="430" fill="url(#glow)"/>
  <circle cx="1260" cy="350" r="214" fill="none" stroke="url(#ring)" stroke-opacity=".44" stroke-width="2"/>
  <circle cx="1260" cy="350" r="164" fill="none" stroke="#6ee7ff" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="1260" cy="350" r="112" fill="#07111f" fill-opacity=".68" stroke="#89dcff" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="1260" cy="350" r="62" fill="#3bbcff" fill-opacity=".16" filter="url(#blur)"/>
  <path d="M1046 350a214 214 0 0 1 344-170" fill="none" stroke="#73ddff" stroke-width="4" stroke-linecap="round"/>
  <path d="M1120 485a164 164 0 0 0 260-24" fill="none" stroke="#8b5cf6" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1084" cy="223" r="6" fill="#78e4ff"/>
  <circle cx="1424" cy="348" r="5" fill="#a78bfa"/>
  <circle cx="1160" cy="500" r="4" fill="#7dd3fc"/>
  <g fill="#b9ddf5" fill-opacity=".28">
    <circle cx="724" cy="112" r="2"/><circle cx="842" cy="582" r="2"/><circle cx="976" cy="152" r="3"/>
    <circle cx="1478" cy="92" r="2"/><circle cx="1510" cy="610" r="3"/><circle cx="610" cy="418" r="2"/>
  </g>
  <path d="M660 542h250" stroke="#72d9ff" stroke-opacity=".14"/>
  <path d="M700 566h154" stroke="#72d9ff" stroke-opacity=".09"/>
</svg>
